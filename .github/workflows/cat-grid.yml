name: Generate cat-grid

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate_cat_grid.py ${{ github.repository_owner }} dist/cat-grid.svg
      - name: Push to output branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan output
          git rm -rf . >/dev/null 2>&1 || true
          cp dist/cat-grid.svg cat-grid.svg
          git add cat-grid.svg
          git commit -m "update cat-grid"
          git push -f origin output
